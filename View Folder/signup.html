<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Signup</title>
    <link rel="stylesheet" href="signupstyle.css?v=2">
</head>
<body>

    <div class="signup-container">
        <form action="signupValidation.php" method="POST">
            <fieldset>
                <legend>Hospital Signup</legend>
                
                <div class="form-group">
                    <label for="hName">Hospital Name:</label>
                    <input type="text" id="hName" name="hospitalName" placeholder="Enter Hospital Name" required />
                </div>

                <div class="form-group">
                    <label for="hTin">Hospital TIN:</label>
                    <input type="text" id="hTin" name="hospitalTIN" placeholder="Enter Hospital TIN" required />
                </div>

                <div class="form-group">
                    <label for="hEmail">Email:</label>
                    <input type="email" id="hEmail" name="hospitalEmail" placeholder="Enter Email" required />
                </div>

                <div class="form-group">
                    <label for="hAddress">Address:</label>
                    <input type="text" id="hAddress" name="hospitalAddress" placeholder="Enter Address" required />
                </div>

                <div class="btn-container">
                    <button type="submit">Submit Request</button>
                    <a href="login.html" class="btn btn-secondary">Back to Login</a>
                </div>
            </fieldset>
        </form>
    </div>

</body>
</html>
